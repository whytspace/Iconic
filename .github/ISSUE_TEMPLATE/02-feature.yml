name: Feature request
description: Suggest an idea for Iconic.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Iconic solve it?
