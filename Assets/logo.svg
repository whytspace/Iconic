<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512"><defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#fff3c4"/><stop offset=".22" stop-color="#f4bb45"/>
  <stop offset=".5" stop-color="#8c5512"/><stop offset=".72" stop-color="#f0b843"/>
  <stop offset="1" stop-color="#4f2c06"/>
</linearGradient>
<linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff0b0"/><stop offset=".35" stop-color="#e9a93a"/>
  <stop offset=".7" stop-color="#7a4610"/><stop offset="1" stop-color="#3b2005"/>
</linearGradient>
<radialGradient id="gem" cx=".38" cy=".3" r=".8">
  <stop offset="0" stop-color="#eaf8ff"/><stop offset=".25" stop-color="#58b8ff"/>
  <stop offset=".6" stop-color="#1253b8"/><stop offset="1" stop-color="#05173f"/>
</radialGradient>
<radialGradient id="glowBlue" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#7fd0ff" stop-opacity=".9"/><stop offset=".5" stop-color="#1e7bff" stop-opacity=".35"/>
  <stop offset="1" stop-color="#0a3cff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glass" cx=".4" cy=".35" r=".7">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".5" stop-color="#9fd8ff" stop-opacity=".25"/>
  <stop offset="1" stop-color="#1b5fae" stop-opacity=".55"/>
</radialGradient>
<linearGradient id="leather" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#2a1408"/><stop offset=".45" stop-color="#7a4422"/><stop offset="1" stop-color="#2a1408"/>
</linearGradient>
<linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#1b2433"/><stop offset="1" stop-color="#05070b"/>
</linearGradient>
<filter id="paint" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="warp"/>
  <feDisplacementMap in="SourceGraphic" in2="warp" scale="5" xChannelSelector="R" yChannelSelector="G" result="wob"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="grain"/>
  <feColorMatrix in="grain" type="saturate" values="0" result="g"/>
  <feComponentTransfer in="g" result="g2">
    <feFuncR type="linear" slope="0.55" intercept="0.62"/><feFuncG type="linear" slope="0.55" intercept="0.62"/><feFuncB type="linear" slope="0.55" intercept="0.62"/>
  </feComponentTransfer>
  <feBlend in="wob" in2="g2" mode="multiply" result="m"/>
  <feComposite in="m" in2="wob" operator="in"/>
</filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<g filter="url(#paint)">
  <polygon points="128,8 238,68 238,188 128,248 18,188 18,68" fill="#120a03"/>
  <polygon points="128,18 228,73 228,183 128,238 28,183 28,73" fill="url(#gold)"/>
  <polygon points="128,40 208,85 208,171 128,216 48,171 48,85" fill="#120a03"/>
  <polygon points="128,46 202,88 202,168 128,210 54,168 54,88" fill="url(#gem)"/>
  <circle cx="128" cy="128" r="70" fill="url(#glowBlue)"/>
  <path d="M86 66 H170 V90 H146 V166 H170 V190 H86 V166 H110 V90 H86 Z" fill="#120a03" stroke="#120a03" stroke-width="12" stroke-linejoin="round"/>
  <path d="M86 66 H170 V90 H146 V166 H170 V190 H86 V166 H110 V90 H86 Z" fill="url(#goldV)"/>
  <path d="M90 70 H166" stroke="#fff3c4" stroke-width="3" opacity=".8"/>
  <circle cx="128" cy="26" r="9" fill="url(#gem)" stroke="#120a03" stroke-width="3"/>
  <circle cx="128" cy="230" r="9" fill="url(#gem)" stroke="#120a03" stroke-width="3"/>
</g>
<path d="M150 46 L153.08 56.92 L164 60 L153.08 63.08 L150 74 L146.92 63.08 L136 60 L146.92 56.92 Z" fill="#fff" filter="url(#glow)"/></svg>